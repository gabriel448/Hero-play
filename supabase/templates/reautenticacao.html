<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Código de verificação — Hero Play</title>
</head>
<body style="margin:0;padding:0;background:#0F0E0D;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#0F0E0D;padding:48px 16px;">
  <tr><td align="center">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">

    <!-- Logo -->
    <tr>
      <td align="center" style="padding-bottom:24px;">
        <table cellpadding="0" cellspacing="0"><tr>
          <td style="background:#1A1815;border:1px solid #2A2622;border-radius:10px;width:38px;height:38px;text-align:center;vertical-align:middle;font-size:20px;color:#E53935;">▶</td>
          <td style="padding-left:10px;font-size:16px;font-weight:700;color:#F5F1EC;white-space:nowrap;">Hero Play</td>
        </tr></table>
      </td>
    </tr>

    <!-- Card -->
    <tr>
      <td style="background:#1A1815;border:1px solid #2A2622;border-radius:16px;overflow:hidden;">
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr><td style="background:#E53935;height:4px;border-radius:16px 16px 0 0;"></td></tr>
        </table>
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:32px 36px;text-align:center;">
              <h1 style="margin:0 0 8px;font-size:22px;font-weight:800;color:#F5F1EC;line-height:1.3;">
                Código de verificação
              </h1>
              <p style="margin:0 0 28px;font-size:14px;color:#A8A09A;line-height:1.6;">
                Use o código abaixo para confirmar sua identidade no Hero Play.
              </p>

              <!-- Código em destaque -->
              <table cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <div style="display:inline-block;background:#252220;border:1px solid #3A3530;border-radius:12px;padding:20px 40px;">
                      <span style="font-size:36px;font-weight:800;color:#F5F1EC;letter-spacing:12px;font-family:'Courier New',monospace;">
                        {{ .Token }}
                      </span>
                    </div>
                  </td>
                </tr>
              </table>

              <p style="margin:24px 0 0;font-size:12px;color:#5C5650;line-height:1.6;">
                Este código expira em 10 minutos. Se você não solicitou, ignore este email.
              </p>
            </td>
          </tr>
        </table>
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr><td style="height:1px;background:#2A2622;"></td></tr>
          <tr>
            <td style="padding:16px 36px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#5C5650;">
                © Hero Play &nbsp;·&nbsp;
                <a href="{{ .SiteURL }}" style="color:#5C5650;text-decoration:underline;">Acessar o site</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  </td></tr>
</table>
</body>
</html>
