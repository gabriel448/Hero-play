<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Hero Play</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/heroplay-icon-192.png">
  <link rel="stylesheet" href="assets/auth.css">
  <script>document.documentElement.classList.add('js-anim');</script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="assets/heroplay-icon-192.png" alt="Hero Play">
      <span>Hero Play</span>
    </a>
    <a class="btn btn-ghost" href="index.html">← Voltar ao site</a>
  </header>

  <main class="center-wrap">
    <div class="card anim-in">

      <!-- ── Step 1: email + senha ────────────────────────────────────────── -->
      <div id="step-auth">
        <h1 id="titulo">Entrar</h1>
        <p class="sub" id="subtitulo">Acesse sua conta para gerenciar suas listas.</p>

        <div class="tabs">
          <span class="tab-indicator" id="tab-indicator"></span>
          <button class="tab active" id="tab-entrar" type="button">Entrar</button>
          <button class="tab" id="tab-criar" type="button">Criar conta</button>
        </div>

        <div class="msg error" id="msg-erro"></div>
        <div class="msg ok"    id="msg-ok"></div>

        <form id="form-auth" autocomplete="on">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="voce@email.com" autocomplete="email">
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <input type="password" id="senha" required minlength="6" placeholder="mínimo 6 caracteres" autocomplete="current-password">
          </div>
          <div class="field" id="field-confirmar" style="display:none">
            <label for="confirmar">Confirmar senha</label>
            <input type="password" id="confirmar" minlength="6" placeholder="repita a senha" autocomplete="new-password">
          </div>
          <label class="lembrar" id="lembrar-wrap">
            <input type="checkbox" id="lembrar" checked>
            <span class="lembrar-box">
              <svg class="lembrar-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            </span>
            <span class="lembrar-text">Lembrar deste dispositivo</span>
          </label>
          <div id="field-termos" style="display:none">
            <label class="lembrar termos" id="termos-wrap">
              <input type="checkbox" id="termos">
              <span class="lembrar-box">
                <svg class="lembrar-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
              </span>
              <span class="lembrar-text">Li e concordo com os <a href="termos.html" target="_blank" rel="noopener">Termos de Serviço</a> e a <a href="privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</span>
            </label>
          </div>
          <button class="btn btn-primary" id="btn-enviar" type="submit">Entrar</button>
        </form>
      </div>

      <!-- ── Step 2: código MFA ───────────────────────────────────────────── -->
      <div id="step-mfa" style="display:none">
        <h1>Verificação em dois fatores</h1>
        <p class="sub">Digite o código de 6 dígitos gerado pelo seu app autenticador.</p>
        <div class="msg error" id="mfa-erro"></div>
        <div class="field" style="margin-top:8px">
          <label for="mfa-code">Código TOTP</label>
          <input type="text" id="mfa-code" class="codigo-grande" maxlength="6"
                 placeholder="000000" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary" id="btn-mfa-verificar" type="button">Verificar</button>
        <button class="btn btn-ghost" id="btn-mfa-email" type="button" style="margin-top:8px;width:100%">Perdi acesso ao MFA — entrar por email</button>
        <button class="btn btn-ghost" id="btn-mfa-voltar" type="button" style="margin-top:4px;width:100%">← Usar outra conta</button>
      </div>

      <!-- ── Step 3: codigo por email (cadastro OU login sem MFA) ─────────── -->
      <div id="step-codigo" style="display:none">
        <h1 id="codigo-titulo">Confirme seu email</h1>
        <p class="sub" id="codigo-sub">Enviamos um código de 6 dígitos para <b id="codigo-email">seu email</b>. Digite-o para ativar sua conta.</p>
        <div class="msg error" id="codigo-erro"></div>
        <div class="msg ok"    id="codigo-ok"></div>
        <div class="field" style="margin-top:8px">
          <label for="codigo-code">Código</label>
          <input type="text" id="codigo-code" class="codigo-grande" maxlength="6"
                 placeholder="000000" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary" id="btn-codigo-verificar" type="button">Confirmar e entrar</button>
        <button class="btn btn-ghost" id="btn-codigo-reenviar" type="button" style="margin-top:8px;width:100%">Reenviar código</button>
        <button class="btn btn-ghost" id="btn-codigo-voltar" type="button" style="margin-top:4px;width:100%">← Voltar</button>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const erro = $('msg-erro'), ok = $('msg-ok');
    let modo = 'entrar';
    let mfaChallengeId = null;
    let mfaFactorId    = null;
    let emailCadastro  = null;
    let emailLogin     = null;       // email usado no login (p/ fallback por email)
    let codigoModo     = 'signup';   // 'signup' (confirmar conta) | 'login-email' (entrar sem MFA)

    if (location.protocol === 'file:') mostrarErroBoot('Abra via servidor HTTP (ex.: npx serve website).');
    if (typeof supabase === 'undefined') mostrarErroBoot('Supabase não carregou. Verifique sua conexão.');
    function mostrarErroBoot(t) { erro.textContent=t; erro.classList.add('show'); }

    const sb = window.criarClienteSupabase();

    /* ── Motion ──────────────────────────────────────────────────────────── */
    const motion = (typeof anime !== 'undefined') &&
      !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!motion) document.documentElement.classList.remove('js-anim');

    /* ── "Lembrar deste dispositivo" ─────────────────────────────────────────
       Grava a preferencia em hp_lembrar ANTES de autenticar (o adapter em
       supabase-config.js decide localStorage x sessionStorage). A caixa anima
       um "pop" e o checkmark e desenhado (stroke-dashoffset) ao alternar. */
    (function initLembrar() {
      const cb = $('lembrar');
      if (!cb) return;
      const box = document.querySelector('.lembrar-box');
      const check = document.querySelector('.lembrar-check path');
      const comprimento = check && check.getTotalLength ? check.getTotalLength() : 24;
      if (check) { check.style.strokeDasharray = comprimento; check.style.strokeDashoffset = cb.checked ? 0 : comprimento; }
      const aplicar = (animar) => {
        localStorage.setItem('hp_lembrar', cb.checked ? '1' : '0');
        if (!check) return;
        if (!motion || !animar) { check.style.strokeDashoffset = cb.checked ? 0 : comprimento; return; }
        anime.remove(box); anime.remove(check);
        anime({ targets: box, scale: [1, 1.18, 1], duration: 340, easing: 'easeOutBack' });
        anime({ targets: check, strokeDashoffset: cb.checked ? [comprimento, 0] : [0, comprimento],
                duration: cb.checked ? 320 : 200, easing: 'easeOutQuad' });
      };
      aplicar(false);
      cb.addEventListener('change', () => aplicar(true));
    })();

    /* ── Checkbox "Concordo com os termos" (obrigatorio no cadastro) ───────── */
    (function initTermos() {
      const cb = $('termos');
      if (!cb) return;
      const cont = $('field-termos');
      const box = cont.querySelector('.lembrar-box');
      const check = cont.querySelector('.lembrar-check path');
      const comprimento = check && check.getTotalLength ? check.getTotalLength() : 24;
      if (check) { check.style.strokeDasharray = comprimento; check.style.strokeDashoffset = cb.checked ? 0 : comprimento; }
      const aplicar = (animar) => {
        if (!check) return;
        if (!motion || !animar) { check.style.strokeDashoffset = cb.checked ? 0 : comprimento; return; }
        anime.remove(box); anime.remove(check);
        anime({ targets: box, scale: [1, 1.18, 1], duration: 340, easing: 'easeOutBack' });
        anime({ targets: check, strokeDashoffset: cb.checked ? [comprimento, 0] : [0, comprimento],
                duration: cb.checked ? 320 : 200, easing: 'easeOutQuad' });
      };
      aplicar(false);
      cb.addEventListener('change', () => { aplicar(true); if (cb.checked) limparMsgs(); });
    })();

    // Chacoalha o checkbox de termos quando o cadastro e tentado sem aceitar.
    function shakeTermos() {
      const cont = $('field-termos');
      if (!motion || !cont) return;
      anime.remove(cont);
      anime({ targets: cont, translateX: [0,-7,7,-5,5,0], duration: 380, easing: 'easeInOutQuad' });
    }

    function moverIndicador(instantaneo) {
      const ind  = $('tab-indicator');
      const alvo = modo === 'entrar' ? $('tab-entrar') : $('tab-criar');
      if (!motion) { ind.style.left=alvo.offsetLeft+'px'; ind.style.width=alvo.offsetWidth+'px'; return; }
      anime.remove(ind);
      anime({ targets:ind, left:alvo.offsetLeft, width:alvo.offsetWidth,
              duration:instantaneo?0:420, easing:'spring(1, 90, 12, 0)' });
    }

    function animarCampo(f, mostrar) {
      if (!f) return;
      if (!motion) { f.style.display=mostrar?'block':'none'; return; }
      anime.remove(f);
      const atual=f.getBoundingClientRect().height;
      if (mostrar) {
        f.style.display='block'; f.style.height='auto';
        const alvo=f.getBoundingClientRect().height;
        f.style.height=atual+'px';
        if (atual===0){ f.style.opacity='0'; f.style.marginBottom='0px'; }
        f.offsetHeight;
        anime({ targets:f, height:alvo, opacity:1, marginBottom:14, duration:380, easing:'easeOutQuad',
                complete:()=>{ f.style.height='auto'; } });
      } else {
        f.style.height=atual+'px'; f.offsetHeight;
        anime({ targets:f, height:0, opacity:0, marginBottom:0, duration:300, easing:'easeInQuad',
                complete:()=>{ f.style.display='none'; f.style.height=''; f.style.marginBottom=''; f.style.opacity=''; } });
      }
    }

    function animarMsg(el) {
      if (!motion) return;
      anime.remove(el);
      anime({ targets:el, opacity:[0,1], translateY:[-6,0], duration:320, easing:'easeOutQuad' });
    }
    function mostrarErro(t){ erro.textContent=t; erro.classList.add('show'); ok.classList.remove('show'); animarMsg(erro); }
    function mostrarOk(t)  { ok.textContent=t;  ok.classList.add('show'); erro.classList.remove('show'); animarMsg(ok); }
    function limparMsgs()  { erro.classList.remove('show'); ok.classList.remove('show'); }

    function navegar(url) {
      if (!motion) { location.replace(url); return; }
      anime({ targets:'.card,.topbar', opacity:[1,0], translateY:[0,-10],
              duration:300, easing:'easeInQuad', complete:()=>location.replace(url) });
    }

    function setModo(novo, opts={}) {
      modo=novo;
      const entrar=novo==='entrar';
      $('tab-entrar').classList.toggle('active', entrar);
      $('tab-criar').classList.toggle('active', !entrar);
      $('titulo').textContent = entrar?'Entrar':'Criar conta';
      $('subtitulo').textContent = entrar
        ? 'Acesse sua conta para gerenciar suas listas.'
        : 'Crie sua conta com email e senha.';
      $('btn-enviar').textContent = entrar?'Entrar':'Criar conta';
      $('senha').setAttribute('autocomplete', entrar?'current-password':'new-password');
      animarCampo($('field-confirmar'), !entrar);
      animarCampo($('field-termos'), !entrar);
      moverIndicador(false);
      if (motion) {
        anime.remove('#titulo,#subtitulo');
        anime({ targets:'#titulo,#subtitulo', opacity:[0,1], translateY:[6,0], duration:320, easing:'easeOutQuad' });
      }
      if (!opts.manterMsg) limparMsgs();
    }

    $('tab-entrar').onclick = () => setModo('entrar');
    $('tab-criar').onclick  = () => setModo('criar');

    document.querySelectorAll('a[href="index.html"]').forEach(a =>
      a.addEventListener('click', e => { e.preventDefault(); navegar('index.html'); }));

    entrada();
    function entrada() {
      moverIndicador(true);
      if (!motion) return;
      anime.timeline({ easing:'easeOutExpo', duration:700 })
        .add({ targets:'.card', opacity:[0,1], translateY:[26,0], scale:[0.98,1] })
        .add({ targets:'.card > h1,.card > .sub,.tabs,#form-auth',
               opacity:[0,1], translateY:[12,0], delay:anime.stagger(70) }, '-=440');
    }

    sb.auth.getSession().then(({ data }) => { if (data.session) location.replace('painel.html'); });

    /* ── Step 1: Login ──────────────────────────────────────────────────── */
    $('form-auth').addEventListener('submit', async e => {
      e.preventDefault();
      limparMsgs();
      const emailVal = $('email').value.trim();
      const senhaVal = $('senha').value;
      const btn = $('btn-enviar');

      if (modo==='criar' && senhaVal!==$('confirmar').value)
        return mostrarErro('As senhas não coincidem.');

      if (modo==='criar' && !$('termos').checked) {
        shakeTermos();
        return mostrarErro('Você precisa aceitar os Termos de Serviço e a Política de Privacidade para criar a conta.');
      }

      btn.disabled=true; btn.textContent='Aguarde…';

      try {
        if (modo==='entrar') {
          const { data, error } = await sb.auth.signInWithPassword({ email:emailVal, password:senhaVal });
          if (error) throw error;
          emailLogin = emailVal; // guarda p/ o fallback "entrar por email" no MFA

          // Verifica se MFA e necessario
          const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
          if (aal?.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') {
            await iniciarDesafioMFA();
          } else {
            navegar('painel.html');
          }
        } else {
          const { data, error } = await sb.auth.signUp({ email:emailVal, password:senhaVal });
          if (error) throw error;
          if (data.session) {
            // "Confirm email" desligado no projeto: ja logou direto.
            mostrarOk('Conta criada! Redirecionando…');
            setTimeout(() => navegar('painel.html'), 900);
          } else {
            // Confirmacao por email exigida: pede o codigo enviado (type:'signup')
            // antes de ativar a conta de fato.
            emailCadastro = emailVal;
            irParaStepCodigo({ email:emailVal, modo:'signup', de:'#step-auth' });
          }
        }
      } catch (err) {
        mostrarErro(traduzErro(err.message||'Erro inesperado.'));
      } finally {
        btn.disabled=false; btn.textContent=modo==='entrar'?'Entrar':'Criar conta';
      }
    });

    /* ── Step 2: Challenge MFA ──────────────────────────────────────────── */
    async function iniciarDesafioMFA() {
      const { data:factors } = await sb.auth.mfa.listFactors();
      const totp = factors?.totp?.find(f => f.status==='verified');
      if (!totp) { navegar('painel.html'); return; }

      mfaFactorId = totp.id;
      const { data:ch, error } = await sb.auth.mfa.challenge({ factorId: mfaFactorId });
      if (error) { mostrarErro('Falha ao iniciar MFA. Tente novamente.'); return; }
      mfaChallengeId = ch.id;

      // Transição step1 → step2
      if (motion) {
        anime({ targets:'#step-auth', opacity:[1,0], translateX:[0,-24], duration:220, easing:'easeInQuad',
          complete:() => {
            $('step-auth').style.display='none';
            $('step-mfa').style.display='';
            anime({ targets:'#step-mfa', opacity:[0,1], translateX:[24,0], duration:320, easing:'easeOutExpo',
                    complete:()=>$('mfa-code').focus() });
          }
        });
      } else {
        $('step-auth').style.display='none';
        $('step-mfa').style.display='';
        $('mfa-code').focus();
      }
    }

    $('btn-mfa-verificar').onclick = async () => {
      const code = $('mfa-code').value.replace(/\D/g,'');
      if (code.length!==6) { $('mfa-erro').textContent='Digite os 6 dígitos.'; $('mfa-erro').classList.add('show'); return; }
      const btn=$('btn-mfa-verificar');
      btn.disabled=true; btn.textContent='Verificando…';
      const { error } = await sb.auth.mfa.verify({ factorId:mfaFactorId, challengeId:mfaChallengeId, code });
      btn.disabled=false; btn.textContent='Verificar';
      if (error) {
        $('mfa-erro').textContent='Código inválido ou expirado.';
        $('mfa-erro').classList.add('show');
        $('mfa-code').value=''; $('mfa-code').focus();
        return;
      }
      navegar('painel.html');
    };

    // Auto-submit ao completar 6 dígitos
    $('mfa-code').addEventListener('input', e => {
      e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
      if (e.target.value.length===6) $('btn-mfa-verificar').click();
    });

    $('btn-mfa-voltar').onclick = async () => {
      await sb.auth.signOut();
      $('step-mfa').style.display='none';
      $('step-auth').style.display='';
      $('mfa-code').value='';
      $('mfa-erro').classList.remove('show');
      // translateX:[-24,0] zera o offset residual deixado pela saida (senao o
      // step-auth volta deslocado pra esquerda).
      if (motion) anime({ targets:'#step-auth', opacity:[0,1], translateX:[-24,0], duration:320, easing:'easeOutExpo' });
      else $('step-auth').style.transform='';
    };

    /* ── Step 3: codigo por email ──────────────────────────────────────────
       Dois modos:
       - 'signup'      : confirma o email do cadastro (verifyOtp type:'signup').
       - 'login-email' : entra sem o MFA (recuperacao) — signInWithOtp + verifyOtp
                          type:'email'. Vai direto ao painel (AAL1), onde da pra
                          remover/reconfigurar o MFA. */
    function irParaStepCodigo({ email, modo, de }) {
      codigoModo = modo;
      const loginEmail = modo === 'login-email';
      $('codigo-titulo').textContent = loginEmail ? 'Entrar por email' : 'Confirme seu email';
      $('codigo-sub').innerHTML = loginEmail
        ? 'Enviamos um código de 6 dígitos para <b id="codigo-email"></b>. Digite-o para entrar sem o MFA.'
        : 'Enviamos um código de 6 dígitos para <b id="codigo-email"></b>. Digite-o para ativar sua conta.';
      $('codigo-email').textContent = email;
      $('btn-codigo-verificar').textContent = loginEmail ? 'Entrar' : 'Confirmar e entrar';
      $('codigo-code').value = '';
      $('codigo-erro').classList.remove('show');
      $('codigo-ok').classList.remove('show');
      codigoVerificando = false;
      const origem = de || '#step-auth';
      const trocar = () => {
        document.querySelector(origem).style.display='none';
        $('step-codigo').style.display='';
        if (motion) anime({ targets:'#step-codigo', opacity:[0,1], translateX:[24,0], duration:320, easing:'easeOutExpo', complete:()=>$('codigo-code').focus() });
        else $('codigo-code').focus();
      };
      if (motion) anime({ targets:origem, opacity:[1,0], translateX:[0,-24], duration:220, easing:'easeInQuad', complete:trocar });
      else trocar();
    }

    let codigoVerificando = false;
    $('btn-codigo-verificar').onclick = async () => {
      if (codigoVerificando) return; // evita verificar 2x e consumir o token
      const code = $('codigo-code').value.replace(/\D/g,'');
      if (code.length!==6) { $('codigo-erro').textContent='Digite os 6 dígitos.'; $('codigo-erro').classList.add('show'); return; }
      codigoVerificando = true;
      const btn=$('btn-codigo-verificar'); const txt=btn.textContent;
      btn.disabled=true; btn.textContent='Verificando…';
      const { error } = codigoModo === 'login-email'
        ? await sb.auth.verifyOtp({ email:emailLogin,    token:code, type:'email'  })
        : await sb.auth.verifyOtp({ email:emailCadastro, token:code, type:'signup' });
      codigoVerificando = false;
      btn.disabled=false; btn.textContent=txt;
      if (error) {
        $('codigo-erro').textContent = traduzErro(error.message) || 'Código inválido ou expirado.';
        $('codigo-erro').classList.add('show'); $('codigo-ok').classList.remove('show');
        $('codigo-code').value=''; $('codigo-code').focus();
        return;
      }
      $('codigo-ok').textContent = codigoModo === 'login-email' ? 'Verificado! Entrando…' : 'Conta confirmada! Entrando…';
      $('codigo-ok').classList.add('show');
      setTimeout(()=>navegar('painel.html'), 800); // login-email entra em AAL1 (sem re-checar MFA)
    };

    $('btn-codigo-reenviar').onclick = async () => {
      const btn=$('btn-codigo-reenviar'); btn.disabled=true; btn.textContent='Reenviando…';
      const { error } = codigoModo === 'login-email'
        ? await sb.auth.signInWithOtp({ email:emailLogin, options:{ shouldCreateUser:false } })
        : await sb.auth.resend({ type:'signup', email:emailCadastro });
      btn.disabled=false; btn.textContent='Reenviar código';
      if (error) { $('codigo-erro').textContent='Falha ao reenviar: '+error.message; $('codigo-erro').classList.add('show'); }
      else { $('codigo-code').value=''; codigoVerificando=false; $('codigo-ok').textContent='Novo código enviado.'; $('codigo-ok').classList.add('show'); $('codigo-erro').classList.remove('show'); }
    };

    $('btn-codigo-voltar').onclick = async () => {
      $('step-codigo').style.display='none';
      if (codigoModo === 'login-email') await sb.auth.signOut().catch(()=>{});
      $('step-auth').style.display='';
      setModo(codigoModo === 'login-email' ? 'entrar' : 'criar');
      if (motion) anime({ targets:'#step-auth', opacity:[0,1], translateX:[-24,0], duration:320, easing:'easeOutExpo' });
      else $('step-auth').style.transform='';
    };

    /* ── Fallback: perdi o MFA, entrar por email ───────────────────────────── */
    $('btn-mfa-email').onclick = async () => {
      const btn=$('btn-mfa-email'); const txt=btn.textContent;
      btn.disabled=true; btn.textContent='Enviando código…';
      $('mfa-erro').classList.remove('show');
      const { error } = await sb.auth.signInWithOtp({ email:emailLogin, options:{ shouldCreateUser:false } });
      btn.disabled=false; btn.textContent=txt;
      if (error) { $('mfa-erro').textContent='Não foi possível enviar o código: '+error.message; $('mfa-erro').classList.add('show'); return; }
      irParaStepCodigo({ email:emailLogin, modo:'login-email', de:'#step-mfa' });
    };

    // Auto-submit ao completar 6 dígitos
    $('codigo-code').addEventListener('input', e => {
      e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
      if (e.target.value.length===6) $('btn-codigo-verificar').click();
    });

    function traduzErro(m) {
      const t=(m||'').toLowerCase();
      if (t.includes('invalid login'))     return 'Email ou senha incorretos.';
      if (t.includes('already registered')||t.includes('already exists')) return 'Esse email já tem conta. Tente entrar.';
      if (t.includes('password should be at least')) return 'A senha precisa ter pelo menos 6 caracteres.';
      if (t.includes('unable to validate email')||t.includes('invalid email')) return 'Email inválido.';
      if (t.includes('email not confirmed')) return 'Confirme seu email antes de entrar.';
      return m||'Erro inesperado. Tente novamente.';
    }
  </script>
</body>
</html>
